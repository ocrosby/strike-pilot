[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strike-pilot"
version = "0.1.0"
description = "SPX intraday bias and credit spread recommendation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "yfinance>=1.2.0",
]

[project.scripts]
strike-pilot = "strike_pilot.cli.commands:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "invoke>=2.2",
    "mypy>=1.10",
    "pytest-mock>=3.15.1",
    "pandas-stubs>=3.0.0.260204",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "C4", "C90", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true
