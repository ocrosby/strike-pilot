[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strike-pilot"
version = "0.1.0"
description = "SPX intraday bias and credit spread recommendation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "invoke>=2.2",
]

[project.scripts]
strike-pilot = "strike_pilot.cli.commands:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "invoke>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "RUF"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.format]
quote-style = "double"
