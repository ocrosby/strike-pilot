name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/strike_pilot --cov-report=term-missing --cov-fail-under=90
